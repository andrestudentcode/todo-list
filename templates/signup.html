<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - MTD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-4 text-center">Sign Up</h3>

                    <!-- If user came from invitation -->
                    {% if detected_team_name %}
                        <div class="alert alert-success text-center">
                            Joining team: <strong>{{ detected_team_name }}</strong>
                        </div>
                    {% endif %}

                    <form action="/signup{% if request.args.get('invite_token') %}?invite_token={{ request.args.get('invite_token') }}{% endif %}" method="POST">
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                        </div>

                        {% if not detected_team_name %}
                        <!-- Only show this if NOT invited -->
                        <div class="mb-3">
                            <label>Select Existing Team (optional)</label>
                            <select name="team_id" class="form-select">
                                <option value="">No Team</option>
                                {% for id, name in teams %}
                                    <option value="{{ id }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Create New Team (optional)</label>
                            <input type="text" name="new_team" class="form-control" placeholder="Or create a new team">
                        </div>
                        {% endif %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Create Account</button>
                            <a href="/login" class="btn btn-outline-secondary">Back to Login</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
