<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks - MTD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-bottom: 20px;
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        .team-info {
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="mb-0">Logged in as <strong>{{ session['email'] }}</strong> (Team: <strong>{{ team_name }}</strong>)</p>
        </div>
        <div>
          <a href="/invite" class="btn btn-outline-primary">Invite Team Member</a>
          <a href="/logout" class="btn btn-outline-danger">Logout</a>
        </div>
    </div>
      

    <form action="/add" method="POST" class="input-group mb-4">
        <input type="text" name="task" class="form-control" placeholder="Add a new task..." required>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <div class="row">
        {% for task in tasks %}
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title {% if task[2] == 'Completed' %}completed{% endif %}">
                        {{ task[1] }}
                    </h5>
                    {% if task[2] != 'Completed' %}
                        <a href="/complete/{{ task[0] }}" class="btn btn-success btn-sm">✔ Complete</a>
                    {% endif %}
                    <a href="/delete/{{ task[0] }}" class="btn btn-danger btn-sm">✖ Delete</a>
                    {% if task[4] %}
                        <div class="mt-3">
                            <small class="text-muted">Additional Info:</small>
                            <div class="border rounded p-2 mt-1 bg-light">
                                {{ task[4]|safe }}
                            </div>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <footer class="bg-light text-end p-3 mt-5">
        <form action="{{ url_for('delete_user', user_id=session['user_id']) }}" method="POST">
            <button type="submit" class="btn btn-danger btn-sm">
                Delete My Account
            </button>
        </form>
    </footer>
</div>
</body>
</html>
