<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks - MTD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-body a {
            word-break: break-all;
        }
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .completed { text-decoration: line-through; color: gray; }
        .team-info { font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="mb-0">Logged in as <strong>{{ session['email'] }}</strong> (Team: <strong>{{ team_name }}</strong>)</p>
        </div>
        <div>
          <a href="/invite" class="btn btn-outline-primary me-2">Invite Team Member</a>
          <button type="button" class="btn btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#uploadModal">Upload File</button>
          <a href="/logout" class="btn btn-outline-danger">Logout</a>
        </div>
    </div>

    <form action="/add" method="POST" class="input-group mb-4">
        <input type="text" name="task" class="form-control" placeholder="Add a new task..." required>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <div class="row">
        {% for task in tasks %}
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title {% if task[2] == 'Completed' %}completed{% endif %}">{{ task[1] }}</h5>
                    {% if task[2] != 'Completed' %}
                        <a href="/complete/{{ task[0] }}" class="btn btn-success btn-sm">✔ Complete</a>
                    {% endif %}
                    <a href="/delete/{{ task[0] }}" class="btn btn-danger btn-sm">✖ Delete</a>
                    {% if task[4] %}
                        <div class="mt-3">
                            <small class="text-muted">AI Suggestions:</small>
                            <div class="border rounded p-2 mt-1 bg-light" style="white-space: pre-line;">
                                {{ task[4]|safe }}
                            </div>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <footer class="bg-light text-end p-3 mt-5">
        <form action="{{ url_for('delete_user', user_id=session['user_id']) }}" method="POST">
            <button type="submit" class="btn btn-danger btn-sm">Delete My Account</button>
        </form>
    </footer>
</div>

<!-- Upload Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="uploadModalLabel">Upload File</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="uploadStatus" class="mb-3"></div>
        <input type="file" id="fileInput" class="form-control">
      </div>
      <div class="modal-footer">
        <button type="button" id="startUpload" class="btn btn-primary">Upload</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('startUpload').addEventListener('click', async () => {
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('uploadStatus');
    if (!fileInput.files.length) {
      statusDiv.innerHTML = '<div class="alert alert-warning">Please select a file.</div>';
      return;
    }
    const file = fileInput.files[0];
    statusDiv.innerHTML = '<div class="alert alert-info">Requesting upload URL...</div>';
    try {
      const res = await fetch(`/sign-s3?file_name=${encodeURIComponent(file.name)}&file_type=${encodeURIComponent(file.type)}`);
      if (!res.ok) throw new Error('Could not get signed URL');
      const postData = await res.json();
      statusDiv.innerHTML = '<div class="alert alert-info">Uploading file...</div>';
      const formData = new FormData();
      Object.entries(postData.fields).forEach(([k, v]) => formData.append(k, v));
      formData.append('file', file);
      const uploadRes = await fetch(postData.url, { method: 'POST', body: formData });
      if (uploadRes.ok) {
        statusDiv.innerHTML = `<div class="alert alert-success">Upload complete! File URL: <a href="${postData.url}/${postData.fields.key}" target="_blank">${postData.url}/${postData.fields.key}</a></div>`;
      } else {
        statusDiv.innerHTML = '<div class="alert alert-danger">Upload failed.</div>';
      }
    } catch (err) {
      statusDiv.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
  });
</script>
</body>
</html>
